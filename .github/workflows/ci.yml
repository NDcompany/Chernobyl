name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    name: TypeScript Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust Runtime Gates
    # services/companion-rs is Windows-first and links system DLLs directly via ffi.rs
    # (kernel32, psapi, ws2_32, crypt32 / DPAPI, bcrypt) with raw Windows socket handles
    # and Windows process extensions without POSIX fallbacks. Linux cannot compile companion-rs,
    # so this job is kept on windows-latest.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, pinned
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/companion-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/companion-rs/Cargo.lock', 'services/companion-rs/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo Test
        run: cargo test --manifest-path services/companion-rs/Cargo.toml

      - name: Cargo Clippy
        run: cargo clippy --manifest-path services/companion-rs/Cargo.toml --all-targets -- -D warnings

      - name: Cargo Format Check
        run: cargo fmt --manifest-path services/companion-rs/Cargo.toml --check

      - name: Cargo Self-Test
        run: cargo run --manifest-path services/companion-rs/Cargo.toml -- --self-test

  interop:
    name: Interop Gate
    needs: [ts, rust]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, pinned
        with:
          toolchain: 1.99.0

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/companion-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/companion-rs/Cargo.lock', 'services/companion-rs/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Run E2E Interop
        run: npm run verify:e2e

  kitkat:
    name: KitKat Client Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # the default "tools platform-tools" asks for the removed `tools` package (sdkmanager 16.0 exits 1)
          packages: platform-tools

      - name: Install Android SDK Packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run KitKat Unit Tests
        run: |
          chmod +x android-kitkat/gradlew
          cd android-kitkat && ./gradlew testDebugUnitTest --console=plain

  setup-script:
    name: Windows Setup Script Test
    needs: [rust]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, pinned
        with:
          toolchain: 1.99.0

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/companion-rs/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('services/companion-rs/Cargo.lock', 'services/companion-rs/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build Companion (Release)
        run: cargo build --release --manifest-path services/companion-rs/Cargo.toml

      - name: Run Windows Setup Test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-setup-windows.ps1 -Exe services/companion-rs/target/release/chernobyl-companion.exe
