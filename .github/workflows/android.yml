name: Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "ndk;27.1.12297006" \
                     "cmake;3.31.6"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Android Release APK
        run: node scripts/build-android.mjs

      - name: Sign Android Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
            if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASS are required on tag builds"
              exit 1
            fi
            echo "ANDROID_KEYSTORE_BASE64 and/or ANDROID_KEYSTORE_PASS not provided: APK will remain debug-signed"
            exit 0
          fi

          SIGNING_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$SIGNING_DIR"
          trap 'rm -rf "$RUNNER_TEMP/keystore"' EXIT

          JKS_PATH="$SIGNING_DIR/chernobyl-release.jks"
          PASS_PATH="$SIGNING_DIR/chernobyl-release.pass"

          echo "$KEYSTORE_BASE64" | base64 -d > "$JKS_PATH"
          printf "%s" "$KEYSTORE_PASS" > "$PASS_PATH"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          for apk in release/*.apk; do
            [ -f "$apk" ] || continue
            CHB_KEYSTORE="$JKS_PATH" node scripts/build-android.mjs --sign-only "$apk"
            CERTS_OUT=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$CERTS_OUT"
            if ! echo "$CERTS_OUT" | grep -qi "certificate SHA-256 digest: c8cc22bdfb6c244447d2a5beb007f8fd6adcd20fb8632b0e5998c6b96ead7d36"; then
              echo "::error::Signer certificate digest does not match pinned SHA-256 c8cc22bdfb6c244447d2a5beb007f8fd6adcd20fb8632b0e5998c6b96ead7d36"
              exit 1
            fi
          done
          echo "Android APK signed and verified successfully with release key"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chernobyl-apk
          path: release/*.apk
          if-no-files-found: error
