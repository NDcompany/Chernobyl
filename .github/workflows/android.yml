name: Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "ndk;27.1.12297006" \
                     "cmake;3.31.6"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASS" ]; then
            SIGNING_DIR="$RUNNER_TEMP/keystore"
            mkdir -p "$SIGNING_DIR"
            JKS_PATH="$SIGNING_DIR/chernobyl-release.jks"
            PASS_PATH="$SIGNING_DIR/chernobyl-release.pass"
            echo "$KEYSTORE_BASE64" | base64 -d > "$JKS_PATH"
            printf "%s" "$KEYSTORE_PASS" > "$PASS_PATH"
            echo "CHB_KEYSTORE=$JKS_PATH" >> "$GITHUB_ENV"
            echo "Release keystore configured for signing"
          else
            echo "ANDROID_KEYSTORE_BASE64 and/or ANDROID_KEYSTORE_PASS not provided: APK will remain debug-signed"
          fi

      - name: Build Android Release APK
        run: node scripts/build-android.mjs

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chernobyl-apk
          path: release/*.apk
          if-no-files-found: error
