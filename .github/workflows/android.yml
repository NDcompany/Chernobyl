name: Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # the default "tools platform-tools" asks for the removed `tools` package (sdkmanager 16.0 exits 1)
          packages: platform-tools

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "ndk;27.1.12297006" \
                     "cmake;3.31.6"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Android Release APK
        run: node scripts/build-android.mjs

      - name: Sign Android Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
            if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASS are required on tag builds"
              exit 1
            fi
            echo "ANDROID_KEYSTORE_BASE64 and/or ANDROID_KEYSTORE_PASS not provided: APK will remain debug-signed"
            exit 0
          fi

          SIGNING_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$SIGNING_DIR"
          trap 'rm -rf "$RUNNER_TEMP/keystore"' EXIT

          JKS_PATH="$SIGNING_DIR/chernobyl-release.jks"
          PASS_PATH="$SIGNING_DIR/chernobyl-release.pass"

          echo "$KEYSTORE_BASE64" | base64 -d > "$JKS_PATH"
          printf "%s" "$KEYSTORE_PASS" > "$PASS_PATH"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          for apk in release/*.apk; do
            [ -f "$apk" ] || continue
            CHB_KEYSTORE="$JKS_PATH" node scripts/build-android.mjs --sign-only "$apk"
            CERTS_OUT=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$CERTS_OUT"
            if ! echo "$CERTS_OUT" | grep -qi "certificate SHA-256 digest: c8cc22bdfb6c244447d2a5beb007f8fd6adcd20fb8632b0e5998c6b96ead7d36"; then
              echo "::error::Signer certificate digest does not match pinned SHA-256 c8cc22bdfb6c244447d2a5beb007f8fd6adcd20fb8632b0e5998c6b96ead7d36"
              exit 1
            fi
          done
          echo "Android APK signed and verified successfully with release key"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chernobyl-apk
          path: release/*.apk
          if-no-files-found: error
